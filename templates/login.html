{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h2>ログイン</h2>

    <!-- エラーメッセージ表示 -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="color: red; margin-bottom: 15px;">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <div style="margin-bottom: 15px;">
            <label for="username">ユーザー名:</label><br>
            <input type="text" id="username" name="username" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="password">パスワード:</label><br>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
            ログイン
        </button>
    </form>
</div>
{% endblock %}
