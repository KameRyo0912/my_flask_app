{% extends 'blog_base.html' %}

{% block title %}記事の編集 - My Flask App{% endblock %}

{% block content %}

<div style="max-width: 600px; margin: 20px auto;">
    <h2>記事の編集</h2>
    <form action="{{ url_for('blog_edit', post_id=post.id) }}" method="POST">
        <div style="margin-bottom: 15px;">
            <label for="title" style="display: block; font-weight: bold; margin-bottom: 5px;">タイトル：</label>
            <input type="text" id="title" name="title" value="{{ post.title }}" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
        </div>
        <div style="margin-bottom: 15px;">
            <label for="body" style="display: block; font-weight: bold; margin-bottom: 5px;">本文：</label>
            <textarea id="body" name="body" rows="8" style="width: 100%; padding: 8px; box-sizing: border-box;" required>{{ post.body }}</textarea>
        </div>
        <button type="submit" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">更新する</button>
        <a href="{{ url_for('blog_detail', post_id=post.id) }}" style="margin-left: 10px; color: #666; text-decoration: none;">キャンセル</a>
    </form>
</div>
<script>
 tinymce.init({
    selector: 'textarea#body',
    plugins: 'image code link lists table',
    toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | image link | code',
    
    // --- 方法2: エディタ側の画像設定 ---
    image_resizing: true,       // ユーザーによる自由リサイズを許可
    image_dimensions: true,     // 幅・高さの入力欄を表示
    
    automatic_uploads: true,
    images_upload_url: '/upload_image',
    images_upload_credentials: true,

    // アップロード前のファイルチェック（サイズ・容量制限）
    images_upload_handler: function (blobInfo, progress) {
        return new Promise((resolve, reject) => {
            // 例: ファイルサイズの上限（5MB制限）
            const maxFileSize = 5 * 1024 * 1024; // 5MB
            if (blobInfo.blob().size() > maxFileSize) {
                reject('ファイルサイズが大きすぎます（最大 5MB まで）');
                return;
            }

            // 画像の縦横ピクセルサイズチェック
            const img = new Image();
            img.src = URL.createObjectURL(blobInfo.blob());
            img.onload = function () {
                // 例: 幅・高さが 4000px を超える超大判画像はリジェクト
                if (img.width > 4000 || img.height > 4000) {
                    reject('画像寸法が大きすぎます（最大 4000x4000 px まで）');
                    return;
                }

                // チェック通過後にサーバーへ送信
                const formData = new FormData();
                formData.append('file', blobInfo.blob(), blobInfo.filename());

                fetch('/upload_image', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(result => {
                    if (result.location) {
                        resolve(result.location);
                    } else {
                        reject(result.error || 'アップロードに失敗しました');
                    }
                })
                .catch(() => reject('アップロード中にエラーが発生しました'));
            };
        });
    }
});
</script>
{% endblock %}
