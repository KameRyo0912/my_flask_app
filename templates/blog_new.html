{% extends 'blog_base.html' %}

{% block title %}新規記事作成 - My Flask App{% endblock %}

{% block content %}
<!-- 1. TinyMCE の CDN を読み込み -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js" referrerpolicy="origin"></script>
<script>
  tinymce.init({
    selector: '#body',  <!-- textarea の id を指定 -->
    language: 'ja',     <!-- 日本語化（未対応の場合は英語UIになります） -->
    height: 400,
    plugins: 'link image code table lists',
    toolbar: 'undo redo | blocks | bold italic | alignleft aligncenter alignright | bullist numlist | link image code'
  });
</script>

<h1>新規記事作成</h1>

<form action="{{ url_for('blog_new') }}" method="POST" style="display: flex; flex-direction: column; gap: 15px; max-width: 800px;">
    <div>
        <label for="title" style="display: block; font-weight: bold;">タイトル:</label>
        <input type="text" id="title" name="title" required style="width: 100%; padding: 8px;">
    </div>

    <div>
        <label for="body" style="display: block; font-weight: bold;">本文:</label>
        <!-- TinyMCEがここをリッチテキスト化します -->
        <textarea id="body" name="body"></textarea>
    </div>

    <div>
        <button type="submit" style="padding: 10px 20px; cursor: pointer;">投稿する</button>
        <a href="{{ url_for('blog_index') }}" style="margin-left: 10px;">キャンセル</a>
    </div>
</form>
{% endblock %}
