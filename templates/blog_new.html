{% extends 'blog_base.html' %}

{% block title %}新規記事作成 - My Flask App{% endblock %}

{% block content %}


<h1>新規記事作成</h1>

<form action="{{ url_for('blog_new') }}" method="POST" style="display: flex; flex-direction: column; gap: 15px; max-width: 800px;">
    <div>
        <label for="title" style="display: block; font-weight: bold;">タイトル:</label>
        <input type="text" id="title" name="title" required style="width: 100%; padding: 8px;">
    </div>

    <div>
        <label for="body" style="display: block; font-weight: bold;">本文:</label>
        <!-- TinyMCEがここをリッチテキスト化します -->
        <textarea id="body" name="body"></textarea>
    </div>

    <div>
        <button type="submit" style="padding: 10px 20px; cursor: pointer;">投稿する</button>
        <a href="{{ url_for('blog_index') }}" style="margin-left: 10px;">キャンセル</a>
    </div>
</form><!-- 1. TinyMCE の CDN を読み込み -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js" referrerpolicy="origin"></script>
<script>
  tinymce.init({
    selector: 'textarea#body',
    plugins: 'image code link lists table',
    toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | image link | code',
    
    // --- 方法2: エディタ側の画像設定 ---
    image_resizing: true,       // ユーザーによる自由リサイズを許可
    image_dimensions: true,     // 幅・高さの入力欄を表示
    
    automatic_uploads: true,
    images_upload_url: '/upload_image',
    images_upload_credentials: true,

    // アップロード前のファイルチェック（サイズ・容量制限）
    images_upload_handler: function (blobInfo, progress) {
        return new Promise((resolve, reject) => {
            // 例: ファイルサイズの上限（5MB制限）
            const maxFileSize = 5 * 1024 * 1024; // 5MB
            if (blobInfo.blob().size > maxFileSize) {
                reject('ファイルサイズが大きすぎます（最大 5MB まで）');
                return;
            }

            // 画像の縦横ピクセルサイズチェック
            const img = new Image();
            img.src = URL.createObjectURL(blobInfo.blob());
            img.onload = function () {
                // 例: 幅・高さが 4000px を超える超大判画像はリジェクト
                if (img.width > 4000 || img.height > 4000) {
                    reject('画像寸法が大きすぎます（最大 4000x4000 px まで）');
                    return;
                }

                // チェック通過後にサーバーへ送信
                const formData = new FormData();
                formData.append('file', blobInfo.blob(), blobInfo.filename());

                fetch('/upload_image', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(result => {
                    if (result.location) {
                        resolve(result.location);
                    } else {
                        reject(result.error || 'アップロードに失敗しました');
                    }
                })
                .catch(() => reject('アップロード中にエラーが発生しました'));
            };
        });
    }
});
</script>
{% endblock %}
