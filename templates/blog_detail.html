{% extends 'base.html' %}

{% block title %}{{ post.title }} - My Flask App{% endblock %}

{% block content %}
<article>
    <h2 style="margin-top:0; font-size:1.6rem; color:#212529;">{{ post.title }}</h2>
    <div style="font-size:0.85rem; color:#868e96; margin-bottom:20px;">
        投稿日: {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}
    </div>

    <!-- 記事本文（TinyMCE等で入ったHTMLを展開） -->
    <div class="post-body" style="line-height:1.7; font-size:1rem;">
        {{ post.body | safe }}
    </div>

    <hr style="border:none; border-top:1px solid #e9ecef; margin:30px 0;">

    <a href="{{ url_for('blog_index') }}" style="color:#0d6efd; text-decoration:none;">← 記事一覧に戻る</a>
</article>
{% endblock %}
